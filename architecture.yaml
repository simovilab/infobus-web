$schema: ./architecture.schema.json

metadata:
  version: "0.1"
  title: Infobús Web Information Architecture
  date: 2026-10-28

pages:
  - name: Home
    path: /
    description: Landing page for the public transportation service.
    components:
      - name: RecentlyVisitedPages
        description: Displays a list of pages the user has recently visited, including routes, stops, and other relevant sections.
        type: editorial_content
      - name: AlertsDigest
        description: Summarizes active alerts affecting the transit service.
        type: editorial_content
      - name: RoutesBanner
        description: Description of the routes and their content.
        type: editorial_content
      - name: StopsBanner
        description: Description of the stops and their content.
        type: editorial_content
      - name: TripsBanner
        description: Description of the trips and their content.
        type: editorial_content
      - name: FaresBanner
        description: Description of the fares and their content.
        type: editorial_content
      - name: AlertsBanner
        description: Description of the alerts and their content.
        type: editorial_content
      - name: NewsBanner
        description: Description of the news and their content.
        type: editorial_content
      - name: EventsBanner
        description: Description of the events and their content.
        type: editorial_content
      - name: BlogBanner
        description: Description of the blog and its content.
        type: editorial_content

  - name: Routes
    path: /routes
    description: Information about all the routes in the transit system.
    components:
      - name: RoutesSearch
        description: Finds routes by name, number, location, or other criteria.
      - name: RoutesMenu
        description: Lists routes by an appropriate grouping such as type or number.
      - name: RoutesMap
        description: Shows all routes within the service area.

  - name: Route
    path: /routes/<route_id>
    description: Detail page for a single transit route.
    components:
      - name: RouteHeader
        description: Presents the route's essential information.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>
            key: components.route_header
        data_entities:
          - routes.route_id
          - routes.route_short_name
          - routes.route_long_name
          - routes.route_desc
          - routes.route_color
          - routes.route_text_color
          - routes.route_type
          - routes.cemv_support
      - name: RouteNextTrips
        description: Shows ongoing and upcoming trips for the current time.
        type: feed
        gtfs: realtime
        endpoints:
          - type: WebSocket
            path: /ws/updates
            topic: route.<route_id>.stop_times
        data_entities:
          - routes.route_short_name
          - collection: trips
            fields:
              - trips.trip_headsign
              - stop_times.departure_time
      - name: RouteAlerts
        description: Displays active alerts that apply to the route.
        type: feed
        gtfs: realtime
        endpoints:
          - type: WebSocket
            path: /ws/updates
            topic: route.<route_id>.alerts
      - name: RouteSchedule
        description: Displays scheduled and estimated departures by stop.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>
            key: components.route_schedule
        data_entities:
          - collection: calendar
            fields:
              - service_id
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
              - start_date
              - end_date
          - collection: calendar_dates
            fields:
              - service_id
              - date
              - exception_type
          - collection: services
            fields:
              - calendar.service_id
              - collection: direction
                fields:
                  - trips.direction_id
                  - route.first_trip_departure_time
                  - route.last_trip_departure_time
                  - collection: trips
                    fields:
                      - trips.trip_id
                      - route.first_stop_name
                      - route.first_departure_time
                      - route.last_stop_name
                      - route.last_arrival_time
                      - collection: stop_times
                        fields:
                          - stops.stop_name
                          - stop_times.departure_time
      - name: RouteMap
        description: Shows trip shapes and, when available, real-time vehicle positions.
        type: feed
        gtfs: schedule
        endpoints:
          - type: GeoJSON
            path: /web/routes/<route_id>/map
      - name: RouteStops
        description: Lists the route's stops in both directions.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>
      - name: RouteFares
        description: Displays fares and fare rules applicable to the route.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>/fares

  - name: Regions
    path: /routes/regions
    description: Bundled routes within a specific region.
    components:
      - name: RegionsSearch
        description: Finds regions by name, identifier, or other criteria.
      - name: RegionsMap
        description: Shows all regions within the service area.

  - name: Region
    path: /routes/regions/<region_id>
    description: Detail page for a single region.
    components:
      - name: RegionHeader
        description: Presents the region's ID, name, and essential information.
      - name: RegionMap
        description: Shows the region's boundaries and included routes.

  - name: Stops
    path: /stops
    description: Information about all stops in the transit system.
    components:
      - name: StopsSearch
        description: Finds stops by name, identifier, location, or other criteria.
      - name: StopsMap
        description: Shows all stops within the service area.
        feed: schedule
        endpoints:
          - type: GeoJSON
            path: /web/stops/map
        data_entities:
          - stops.stop_id
          - stops.stop_name
          - stops.stop_lat
          - stops.stop_lon

  - name: Stop
    path: /stops/<stop_id>
    description: Detail page for a single transit stop.
    components:
      - name: StopHeader
        description: Presents the stop's essential information.
        feed: schedule
        endpoints:
          - type: JSON
            path: /web/stops/<stop_id>
            key: components.stop_header
        data_entities:
          - stops.stop_id
          - stops.stop_code
          - stops.stop_name
          - stops.stop_desc
          - stops.stop_lat
          - stops.stop_lon
          - stops.wheelchair_boarding
      - name: StopNextArrivals
        description: Shows upcoming arrivals at the stop.
        feed: realtime
        endpoints:
          - type: WebSocket
            path: /ws/updates
            topic: stop.<stop_id>.stop_times
        data_entities:
          - stops.stop_name
          - collection: trips
            fields:
              - routes.route_short_name
              - trips.trip_headsign
              - stop_times.departure_time
      - name: StopAlerts
        description: Displays active alerts that apply to the stop.
        feed: realtime
        endpoints:
          - type: WebSocket
            path: /ws/updates
            topic: stop.<stop_id>.alerts
      - name: StopRoutes
        description: Lists routes that serve the stop.
        feed: schedule
        endpoints:
          - type: JSON
            path: /web/stops/<stop_id>
            key: components.stop_routes
        data_entities:
          - collection: routes
            fields:
              - routes.route_id
              - routes.route_short_name
              - routes.route_long_name
              - routes.route_color
              - routes.route_text_color
              - trips.direction_id
      - name: StopMap
        description: Shows the stop location and nearby area.
        feed: schedule
        endpoints:
          - type: GeoJSON
            path: /web/stops/<stop_id>/map

  - name: Trips
    path: /trips
    description: Information about current and recent trips in the transit system.
    components:
      - name: TripsSearch
        description: Finds trips by route, stop, time, or other criteria.
      - name: TripsMap
        description: Shows paths and, when available, real-time positions of current trips.

  - name: Trip
    path: /trips/<run_id>
    description: Detail page for a single transit trip.
    components:
      - name: TripHeader
        description: Presents the trip's ID, route, stops, and essential information.
      - name: TripNextStops
        description: Shows the trip's upcoming stops.
      - name: TripAlerts
        description: Displays active alerts that apply to the trip.
      - name: TripMap
        description: Shows the trip path and, when available, its real-time position.

  - name: Fares
    path: /fares
    description: Information about all fare products and payment options.
    components:
      - name: FaresSearch
        description: Finds fare products by name, audience, zone, or price.
      - name: FaresProductMenu
        description: Lists available fare products and their primary characteristics.

  - name: Fare Product
    path: /fares/<fare_product_id>
    description: Detail page for a single fare product.
    components:
      - name: FareProductHeader
        description: Presents the fare product's name, price, and key eligibility information.
      - name: FareProductDescription
        description: Explains validity, purchase, use, and fare rules.

  - name: Alerts
    path: /alerts
    description: Information about all current and recent service alerts.
    components:
      - name: AlertsSearch
        description: Finds alerts by affected service, location, or period.
      - name: AlertsMenu
        description: Lists alerts and summarizes their severity and affected services.

  - name: Alert
    path: /alerts/<entity_id>
    description: Detail page for a single service alert.
    components:
      - name: AlertHeader
        description: Presents the alert title, severity, and affected entities.
      - name: AlertPeriod
        description: Shows the alert's active period and update time.
      - name: AlertDescription
        description: Explains the disruption, impact, and passenger guidance.

  - name: News
    path: /news
    description: News and updates about the public transportation service.
    components:
      - name: NewsSearch
        description: Finds news items by topic, date, or keyword.
      - name: NewsMenu
        description: Lists published news and service updates.

  - name: News Article
    path: /news/<slug>
    description: Detail page for a news article.
    components:
      - name: ArticleHeader
        description: Presents the article title, publication information, and summary.
      - name: ArticleBody
        description: Renders the article content and supporting media.

  - name: Blog
    path: /blog
    description: Articles and blog posts related to public transportation.
    components:
      - name: PageHeader
        description: Introduces the blog and its editorial scope.
      - name: ArticleMenu
        description: Lists blog posts with publication information and summaries.

  - name: Blog Post
    path: /blog/<slug>
    description: Detail page for a blog post.
    components:
      - name: PostHeader
        description: Presents the post title, authors, date, and summary.
      - name: PostBody
        description: Renders the post content and supporting media.

  - name: Events
    path: /events
    description: Information about transit-related events.
    components:
      - name: EventsSearch
        description: Finds events by date, location, or topic.
      - name: EventsMenu
        description: Lists upcoming and recent events.

  - name: Event
    path: /events/<slug>
    description: Detail page for a transit-related event.
    components:
      - name: EventHeader
        description: Presents the event title, date, location, and essential details.
      - name: EventBody
        description: Renders the event description, schedule, and supporting media.

  - name: Resources
    path: /resources
    description: Entry point for passenger resources and service guidance.
    components:
      - name: PageHeader
        description: Introduces the available passenger resources.
      - name: ResourcesMenu
        description: Links to the guide, accessibility, and tourism resources.

  - name: User Guide
    path: /resources/guide
    description: Guide to using the public transportation service.
    components:
      - name: PageHeader
        description: Introduces the passenger usage guide.
      - name: PictureAndText
        description: Explains common passenger journeys with text and illustrations.

  - name: Accessibility
    path: /resources/accessibility
    description: Information about accessibility across the public transportation service.
    components:
      - name: PageHeader
        description: Introduces accessibility commitments and available support.
      - name: PictureAndText
        description: Explains accessible service features and how to use them.

  - name: Tourism
    path: /resources/tourism
    description: Public transportation information for visitors and tourists.
    components:
      - name: PageHeader
        description: Introduces visitor-focused transport information.
      - name: PictureAndText
        description: Explains tickets, key destinations, and visitor travel guidance.

  - name: Design
    path: /design
    description: Information about the service's visual identity.
    components:
      - name: PageHeader
        description: Introduces the visual identity and its purpose.
      - name: Pictures
        description: Displays visual identity examples and design assets.

  - name: Engineering
    path: /engineering
    description: Information about the engineering aspects of the transit service.
    components:
      - name: PageHeader
        description: Introduces the service's technical and engineering work.
      - name: PictureAndText
        description: Explains engineering systems, infrastructure, and practices.

  - name: Data
    path: /data
    description: Information about public transportation data and feed metadata.
    components:
      - name: PageHeader
        description: Presents the service's data publication information.
      - name: DataSummary
        description: Displays feed metadata, availability, and data-use information.
      - name: DataMenu
        description: Links to available datasets and GTFS documentation.

  - name: GTFS
    path: /data/gtfs
    description: Information about the General Transit Feed Specification data feed.
    components:
      - name: PageHeader
        description: Introduces the GTFS feed and its intended use.
      - name: GtfsReference
        description: Describes the published GTFS files, fields, and update cadence.

  - name: Operators
    path: /operators
    description: Information about administrative management and service operators.
    components:
      - name: PageHeader
        description: Introduces the organizations responsible for the service.
      - name: OperatorsMenu
        description: Lists operators and their responsibilities.

  - name: FAQ
    path: /faq
    description: Frequently asked questions about the public transportation service.
    components:
      - name: PageHeader
        description: Introduces the frequently asked questions.
      - name: FaqList
        description: Groups answers to common passenger questions by topic.

  - name: Legal
    path: /legal
    description: Legal information and terms of use for the service.
    components:
      - name: PageHeader
        description: Introduces the legal information and terms.
      - name: LegalDocuments
        description: Lists and renders applicable terms, policies, and notices.

  - name: Contact
    path: /contact
    description: Contact information for the public transportation service.
    components:
      - name: PageHeader
        description: Introduces available support and contact channels.
      - name: ContactChannels
        description: Lists contact methods, hours, and emergency guidance.

  - name: About
    path: /about
    description: Overview of InfoTP and the public transportation service.
    components:
      - name: PageHeader
        description: Introduces InfoTP's mission, scope, and service area.
      - name: PictureAndText
        description: Explains the service's history, purpose, and public value.
