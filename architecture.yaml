$schema: ./architecture.schema.json

metadata:
  version: "0.2"
  title: Infobús Web Information Architecture
  date: 2026-11-04

pages:
  - name: Home
    path: /
    description: Landing page for the public transportation service.
    components:
      - name: RecentlyVisitedPages
        description: Displays a list of pages the user has recently visited, including routes, stops, and other relevant sections.
        type: local_storage
        structure:
          type: array
          values:
            - recent_pages.title
            - recent_pages.path
            - recent_pages.visited_at
      - name: AlertsDigest
        description: Summarizes active alerts affecting the transit service.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/home
            key: components.alerts_digest
        structure:
          type: object
          values:
            - feed_header.timestamp
            - alert.active_count
            - name: alerts
              type: array
              values:
                - feed_entity.id
                - alerts.header_text
                - alerts.effect
                - alerts.severity_level
                - alerts.impact_period.start
                - alerts.impact_period.end
                - name: affected_routes
                  type: array
                  values:
                    - routes.route_id
                    - routes.route_short_name
                    - routes.route_color
                    - routes.route_text_color
      - name: RoutesBanner
        description: Description of the routes and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - routes_banner.header
            - routes_banner.body
            - routes_banner.image_url
      - name: StopsBanner
        description: Description of the stops and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - stops_banner.header
            - stops_banner.body
            - stops_banner.image_url
      - name: TripsBanner
        description: Description of the trips and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - trips_banner.header
            - trips_banner.body
            - trips_banner.image_url
      - name: FaresBanner
        description: Description of the fares and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - fares_banner.header
            - fares_banner.body
            - fares_banner.image_url
      - name: AlertsBanner
        description: Description of the alerts and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - alerts_banner.header
            - alerts_banner.body
            - alerts_banner.image_url
      - name: NewsBanner
        description: Description of the news and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - news_banner.header
            - news_banner.body
            - news_banner.image_url
      - name: EventsBanner
        description: Description of the events and their content.
        type: editorial_content
        structure:
          type: object
          values:
            - events_banner.header
            - events_banner.body
            - events_banner.image_url
      - name: BlogBanner
        description: Description of the blog and its content.
        type: editorial_content
        structure:
          type: object
          values:
            - blog_banner.header
            - blog_banner.body
            - blog_banner.image_url

  - name: Routes
    path: /routes
    description: Information about all the routes in the transit system.
    components:
      - name: PageHeader
        description: Introduces the routes section and how to browse it.
        type: editorial_content
        structure:
          type: object
          values:
            - routes_page.title
            - routes_page.description
      - name: RoutesSearch
        description: Finds routes by name, number, location, or other criteria.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/search
            key: components.routes_search
        structure:
          type: array
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_long_name
            - routes.route_desc
            - routes.route_type
            - routes.route_color
            - routes.route_text_color
            - agency.agency_name
            - networks.network_name
      - name: RoutesMenu
        description: Lists routes by an appropriate grouping such as type or number.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes
            key: components.routes_menu
        structure:
          type: array
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_long_name
            - routes.route_type
            - routes.route_color
            - routes.route_text_color
            - routes.route_sort_order
            - networks.network_id
            - networks.network_name
      - name: RoutesMap
        description: Shows all routes within the service area.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/routes/map
        structure:
          type: array
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_color
            - routes.route_text_color
            - name: shapes # check with Fabián: simplified geometry here, full shape requested apart (the full shapes of all the routes are heavy)
              type: array
              values:
                - trips.direction_id
                - shapes.shape_id

  - name: Route
    path: /routes/<route_id>
    description: Detail page for a single transit route.
    components:
      - name: RouteHeader
        description: Presents the route's essential information.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/<route_id>
            key: components.route_header
        structure:
          type: object
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_long_name
            - routes.route_desc
            - routes.route_color
            - routes.route_text_color
            - routes.route_type
            - routes.cemv_support
            - routes.agency_id
            - routes.network_id
            - routes.continuous_pickup
            - routes.continuous_drop_off
      - name: RouteNextTrips
        description: Shows ongoing and upcoming trips for the current time.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/<route_id>
            key: components.route_next_trips
          - protocol: WebSocket
            format: JSON
            path: /ws/updates
            topic: route.<route_id>.stop_times
        structure:
          type: object
          values:
            - routes.route_id
            - routes.route_short_name
            - trip_updates.timestamp
            - name: trips
              type: array
              values:
                - run.id
                - trips.trip_id
                - trips.trip_headsign
                - trips.direction_id
                - trips.wheelchair_accessible
                - trip.first_stop_name
                - trip.last_stop_name
                - stop_times.departure_time
                - trip_updates.trip.schedule_relationship
                - trip_updates.stop_time_update.departure.time
                - trip_updates.stop_time_update.departure.delay
                - vehicle_positions.occupancy_status
      - name: RouteAlerts
        description: Displays active alerts that apply to the route.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/<route_id>
            key: components.route_alerts
          - protocol: WebSocket
            format: JSON
            path: /ws/updates
            topic: route.<route_id>.alerts
        structure:
          type: object
          values:
            - feed_header.timestamp
            - name: alerts
              type: array
              values:
                - feed_entity.id
                - alerts.header_text
                - alerts.tts_header_text
                - alerts.cause
                - alerts.effect
                - alerts.severity_level
                - alert.status
                - alerts.impact_period.start
                - alerts.impact_period.end
                - alerts.informed_entity.direction_id
                - alerts.informed_entity.stop_id
      - name: RouteSchedule
        description: Displays scheduled and estimated departures by stop.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/<route_id>
            key: components.route_schedule
        structure:
          type: object
          values:
            - name: calendar
              type: array
              values:
                - calendar.service_id
                - calendar.monday
                - calendar.tuesday
                - calendar.wednesday
                - calendar.thursday
                - calendar.friday
                - calendar.saturday
                - calendar.sunday
                - calendar.start_date
                - calendar.end_date
            - name: calendar_dates
              type: array
              values:
                - calendar_dates.service_id
                - calendar_dates.date
                - calendar_dates.exception_type
            - name: services
              type: array
              values:
                - calendar.service_id
                - name: directions
                  type: array
                  values:
                    - trips.direction_id
                    - route.first_trip_departure_time
                    - route.last_trip_departure_time
                    - name: trips
                      type: array
                      values:
                        - trips.trip_id
                        - route.first_stop_name
                        - route.first_departure_time
                        - route.last_stop_name
                        - route.last_arrival_time
                        - name: stop_times
                          type: array
                          values:
                            - stops.stop_name
                            - stop_times.departure_time
      - name: RouteMap
        description: Shows trip shapes and, when available, real-time vehicle positions.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/routes/<route_id>/map
          - protocol: WebSocket
            format: JSON
            path: /ws/updates
            topic: route.<route_id>.vehicle_positions
        structure:
          type: object
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_color
            - routes.route_text_color
            - name: directions
              type: array
              values:
                - trips.direction_id
                - trips.trip_headsign
                - name: shapes
                  type: array
                  values:
                    - shapes.shape_id
                    - shapes.shape_pt_lat
                    - shapes.shape_pt_lon
                    - shapes.shape_pt_sequence
                - name: stops
                  type: array
                  values:
                    - stops.stop_id
                    - stops.stop_name
                    - stops.stop_lat
                    - stops.stop_lon
                    - stop_times.stop_sequence
            - name: vehicles
              type: array
              values:
                - run.id
                - trips.trip_id
                - trips.direction_id
                - vehicle_positions.position.latitude
                - vehicle_positions.position.longitude
                - vehicle_positions.position.bearing
                - vehicle_positions.vehicle.label
                - vehicle_positions.occupancy_status
                - vehicle_positions.timestamp
      - name: RouteStops
        description: Lists the route's stops in both directions.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/<route_id>
            key: components.route_stops
        structure:
          type: array
          values:
            - trips.direction_id
            - trips.trip_headsign
            - name: stops
              type: array
              values:
                - stop_times.stop_sequence
                - stops.stop_id
                - stops.stop_code
                - stops.stop_name
                - stops.tts_stop_name
                - stops.stop_desc
                - stops.stop_lat
                - stops.stop_lon
                - stops.zone_id
                - stops.stop_url
                - stops.location_type
                - stops.parent_station
                - stops.stop_timezone
                - stops.wheelchair_boarding
                - stops.level_id
                - stops.platform_code
                - stops.stop_access
      - name: RouteFares
        description: Displays fares and fare rules applicable to the route.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/<route_id>/fares
            key: components.route_fares
        structure:
          type: object
          values:
            - routes.route_id
            - routes.network_id
            - name: fare_products
              type: array
              values:
                - fare_products.fare_product_id
                - fare_products.fare_product_name
                - fare_products.amount
                - fare_products.currency
                - fare_media.fare_media_name
                - fare_media.fare_media_type
                - rider_categories.rider_category_name
            - name: leg_rules
              type: array
              values:
                - fare_leg_rules.leg_group_id
                - fare_leg_rules.from_area_id
                - fare_leg_rules.to_area_id
                - areas.area_name
                - fare_leg_rules.fare_product_id

  - name: Regions
    path: /routes/regions
    description: Bundled routes within a specific region.
    components:
      - name: RegionsSearch
        description: Finds regions by name, identifier, or other criteria.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/regions/search # check with Fabián: same prefix as the page path (/routes/regions) instead of /web/regions
            key: components.regions_search
        structure:
          type: array
          values:
            - networks.network_id
            - networks.network_name
            - name: routes
              type: array
              values:
                - routes.route_id
                - routes.route_short_name
                - routes.route_long_name
      - name: RegionsMap
        description: Shows all regions within the service area.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/routes/regions/map
        structure:
          type: array
          values:
            - networks.network_id
            - networks.network_name
            - name: routes
              type: array
              values:
                - routes.route_id
                - routes.route_color
                - routes.route_text_color
                - name: shapes # check with Fabián: simplified geometry here, full shape requested apart
                  type: array
                  values:
                    - trips.direction_id
                    - shapes.shape_id

  - name: Region
    path: /routes/regions/<region_id>
    description: Detail page for a single region.
    components:
      - name: RegionHeader
        description: Presents the region's ID, name, and essential information.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/regions/<region_id>
            key: components.region_header
        structure:
          type: object
          values:
            - networks.network_id
            - networks.network_name
            - agency.agency_name
      - name: RegionRoutes # check with Fabián: new component, the page only had header and map
        description: Lists the routes that belong to the region.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/routes/regions/<region_id>
            key: components.region_routes
        structure:
          type: array
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_long_name
            - routes.route_desc
            - routes.route_type
            - routes.route_color
            - routes.route_text_color
            - routes.route_sort_order
      - name: RegionMap
        description: Shows the region's boundaries and included routes.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/routes/regions/<region_id>/map
        structure:
          type: object
          values:
            - networks.network_id
            - name: routes
              type: array
              values:
                - routes.route_id
                - routes.route_short_name
                - routes.route_color
                - routes.route_text_color
                - name: shapes
                  type: array
                  values:
                    - trips.direction_id
                    - shapes.shape_id

  - name: Stops
    path: /stops
    description: Information about all stops in the transit system.
    components:
      - name: PageHeader
        description: Introduces the stops section and how to find a stop.
        type: editorial_content
        structure:
          type: object
          values:
            - stops_page.title
            - stops_page.description
      - name: StopsSearch
        description: Finds stops by name, identifier, location, or other criteria.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/stops/search
            key: components.stops_search
        structure:
          type: array
          values:
            - stops.stop_id
            - stops.stop_code
            - stops.stop_name
            - stops.stop_desc
            - stops.stop_lat
            - stops.stop_lon
            - stops.location_type
            - stops.parent_station
            - stops.wheelchair_boarding
      - name: StopsMap
        description: Shows all stops within the service area.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/stops/map
        structure:
          type: array
          values:
            - stops.stop_id
            - stops.stop_code
            - stops.stop_name
            - stops.stop_desc
            - stops.stop_lat
            - stops.stop_lon
            - stops.location_type
            - stops.parent_station
            - stops.wheelchair_boarding

  - name: Stop
    path: /stops/<stop_id>
    description: Detail page for a single transit stop.
    components:
      - name: StopHeader
        description: Presents the stop's ID, name, and essential information.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/stops/<stop_id>
            key: components.stop_header
        structure:
          type: object
          values:
            - stops.stop_id
            - stops.stop_code
            - stops.stop_name
            - stops.tts_stop_name
            - stops.stop_desc
            - stops.stop_lat
            - stops.stop_lon
            - stops.zone_id
            - stops.stop_url
            - stops.location_type
            - stops.parent_station
            - stops.stop_timezone
            - stops.wheelchair_boarding
            - stops.level_id
            - stops.platform_code
            - stops.stop_access
      - name: StopNextArrivals
        description: Shows upcoming arrivals at the stop.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/stops/<stop_id>
            key: components.stop_next_arrivals
          - protocol: WebSocket
            format: JSON
            path: /ws/updates
            topic: stop.<stop_id>.stop_times
        structure:
          type: object
          values:
            - stops.stop_id
            - stops.stop_name
            - trip_updates.timestamp
            - name: trips
              type: array
              values:
                - run.id
                - routes.route_id
                - routes.route_short_name
                - routes.route_color
                - routes.route_text_color
                - trips.trip_id # check with Fabián: only needed once realtime is added
                - trips.trip_headsign
                - trips.direction_id
                - trips.wheelchair_accessible
                - stop_times.arrival_time
                - stop_times.departure_time
                - trip_updates.trip.schedule_relationship
                - trip_updates.stop_time_update.arrival.time
                - trip_updates.stop_time_update.arrival.delay
                - vehicle_positions.occupancy_status
      - name: StopAlerts
        description: Displays active alerts that apply to the stop.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/stops/<stop_id>
            key: components.stop_alerts
          - protocol: WebSocket
            format: JSON
            path: /ws/updates
            topic: stop.<stop_id>.alerts
        structure:
          type: object
          values:
            - feed_header.timestamp
            - name: alerts
              type: array
              values:
                - feed_entity.id
                - alerts.header_text
                - alerts.tts_header_text
                - alerts.cause
                - alerts.effect
                - alerts.severity_level
                - alert.status
                - alerts.impact_period.start
                - alerts.impact_period.end
                - alerts.informed_entity.route_id
                - alerts.informed_entity.direction_id
      - name: StopRoutes
        description: Lists routes that serve the stop.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/stops/<stop_id>
            key: components.stop_routes
        structure:
          type: array
          values:
            - routes.route_id
            - routes.route_short_name
            - routes.route_long_name
            - routes.route_desc
            - routes.route_type # check with Fabián the relevancy of this data
            - routes.route_url
            - routes.route_color
            - routes.route_text_color
            - routes.route_sort_order
            - name: directions
              type: array
              values:
                - trips.direction_id
                - trips.trip_headsign
                - name: departures
                  type: array
                  values:
                    - trips.trip_id
                    - trips.service_id # check with Fabián the relevancy of this data
                    - stop_times.arrival_time
                    - stop_times.departure_time
      - name: StopMap
        description: Shows the stop location and nearby area.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/stops/<stop_id>/map
        structure:
          type: object
          values:
            - stops.stop_id
            - stops.stop_name
            - stops.stop_lat
            - stops.stop_lon
            - stops.location_type
            - stops.wheelchair_boarding
            - name: nearby_stops # check with Fabián the relevancy of this data
              type: array
              values:
                - stops.stop_id
                - stops.stop_name
                - stops.stop_lat
                - stops.stop_lon
                - stops.location_type
                - stops.wheelchair_boarding
            - name: routes
              type: array
              values:
                - routes.route_id
                - routes.route_short_name
                - routes.route_color
                - name: shapes # check with Fabián: heavy (~1,800 points per shape)
                  type: array
                  values:
                    - shapes.shape_id
                    - shapes.shape_pt_lat
                    - shapes.shape_pt_lon
                    - shapes.shape_pt_sequence

  - name: Trips
    path: /trips
    description: Current and recent trips in the network, and departures by stop, route, destination and time.
    components:
      - name: PageHeader
        description: Introduces the trips section and how to find a departure.
        type: editorial_content
        structure:
          type: object
          values:
            - trips_page.title
            - trips_page.description
      - name: TripsFinder
        description: Searches stops by name, sign code or nearby location, routes by number or name, and destinations by place.
        type: feed
        gtfs: schedule
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/trips/search
            key: components.trips_finder
        structure:
          type: object
          values:
            - name: stops
              type: array
              values:
                - stops.stop_id
                - stops.stop_code
                - stops.stop_name
                - stops.stop_desc
                - stops.platform_code
                - stops.location_type
                - stops.parent_station
                - stops.wheelchair_boarding
                - stops.stop_lat
                - stops.stop_lon
            - name: routes
              type: array
              values:
                - routes.route_id
                - routes.route_short_name
                - routes.route_long_name
                - routes.route_color
                - routes.route_text_color
                - agency.agency_name
            - name: destinations
              type: array
              values:
                - trips.trip_headsign
                - routes.route_id
                - routes.route_short_name
      - name: TripsRecentChoices
        description: Remembers the stops, routes and destinations recently chosen or saved on this device, for quick reuse in the finder.
        type: local_storage
        structure:
          type: array
          values:
            - recent_choices.kind
            - recent_choices.id
            - recent_choices.label
            - recent_choices.saved
            - recent_choices.chosen_at
      - name: TripsDisruptions
        description: Flags alerts on the chosen stop and routes above the results, or the most severe network alerts when nothing is chosen, each linking to its alert page.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/trips
            key: components.trips_disruptions
        structure:
          type: object
          values:
            - feed_header.timestamp
            - name: alerts
              type: array
              values:
                - feed_entity.id
                - alerts.header_text
                - alerts.effect
                - alerts.severity_level
                - alert.status
                - alerts.informed_entity.agency_id
                - alerts.informed_entity.route_id
                - alerts.informed_entity.route_type
                - alerts.informed_entity.stop_id
      - name: TripsDepartures
        description: Once a stop, route or destination is chosen, lists departures for that time, marks each as live or scheduled, flags cancelled, accessible and crowded buses and the last bus, and says when there is no more service.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: JSON
            path: /web/trips
            key: components.trips_departures
        structure:
          type: object
          values:
            - stops.stop_id
            - stops.stop_code
            - stops.stop_name
            - stops.platform_code
            - stops.wheelchair_boarding
            - trip_updates.timestamp
            - name: service_exceptions
              type: array
              values:
                - calendar_dates.service_id
                - calendar_dates.date
                - calendar_dates.exception_type
