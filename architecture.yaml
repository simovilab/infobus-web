          type: object
          values:
            - alerts.description_text
            - alerts.tts_description_text
            - alerts.cause
            - alerts.cause_detail
            - alerts.effect
            - alerts.effect_detail
            - alerts.url
            - alerts.image.localized_image.url
            - alerts.image_alternative_text
            - name: temporary_stops
              type: array
              values:
                - trip_modifications.modifications.service_alert_id
                - trip_modifications.modifications.replacement_stops.stop_id
                - trip_modifications.modifications.replacement_stops.travel_time_to_stop
                - stops.stop_name
                - feed_entity.stop.stop_name
      - name: AlertGuidance
        description: Renders staff-written advice, such as alternative routes, walking directions to temporary stops and photos.
        type: editorial_content
        structure:
          type: object
          values:
            - alert_guidance.body
            - alert_guidance.image.src
            - alert_guidance.updated_at
      - name: AlertMap
        description: Loads on request a map of the affected stops, the detour path and the temporary stops.
        type: feed
        gtfs: realtime
        endpoints:
          - protocol: HTTP
            format: GeoJSON
            path: /web/alerts/<entity_id>/map
        structure:
          type: object
          values:
            - name: shapes
              type: array
              values:
                - shapes.shape_id
                - shapes.shape_pt_lat
                - shapes.shape_pt_lon
                - shapes.shape_pt_sequence
            - trip_modifications.modifications.service_alert_id
            - trip_modifications.selected_trips.shape_id
            - feed_entity.shape.shape_id
            - feed_entity.shape.encoded_polyline
            - name: stops
              type: array
              values:
                - stops.stop_id
                - stops.stop_lat
                - stops.stop_lon
            - name: temporary_stops
              type: array
              values:
                - feed_entity.stop.stop_id
                - feed_entity.stop.stop_lat
                - feed_entity.stop.stop_lon

