$schema: ./architecture.schema.json

metadata:
  version: "0.1"
  title: Infobús Web Information Architecture
  date: 2026-10-28

pages:
  - name: Home
    path: /
    description: Landing page for the public transportation service.
    components:
      - name: RecentlyVisitedPages
        description: Displays a list of pages the user has recently visited, including routes, stops, and other relevant sections.
        type: editorial_content
      - name: AlertsDigest
        description: Summarizes active alerts affecting the transit service.
        type: editorial_content
      - name: RoutesBanner
        description: Description of the routes and their content.
        type: editorial_content
      - name: StopsBanner
        description: Description of the stops and their content.
        type: editorial_content
      - name: TripsBanner
        description: Description of the trips and their content.
        type: editorial_content
      - name: FaresBanner
        description: Description of the fares and their content.
        type: editorial_content
      - name: AlertsBanner
        description: Description of the alerts and their content.
        type: editorial_content
      - name: NewsBanner
        description: Description of the news and their content.
        type: editorial_content
      - name: EventsBanner
        description: Description of the events and their content.
        type: editorial_content
      - name: BlogBanner
        description: Description of the blog and its content.
        type: editorial_content

  - name: Routes
    path: /routes
    description: Information about all the routes in the transit system.
    components:
      - name: RoutesSearch
        description: Finds routes by name, number, location, or other criteria.
      - name: RoutesMenu
        description: Lists routes by an appropriate grouping such as type or number.
      - name: RoutesMap
        description: Shows all routes within the service area.

  - name: Route
    path: /routes/<route_id>
    description: Detail page for a single transit route.
    components:
      - name: RouteHeader
        description: Presents the route's essential information.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>
            key: components.route_header
        data_entities:
          - routes.route_id
          - routes.route_short_name
          - routes.route_long_name
          - routes.route_desc
          - routes.route_color
          - routes.route_text_color
          - routes.route_type
          - routes.cemv_support
      - name: RouteNextTrips
        description: Shows ongoing and upcoming trips for the current time.
        type: feed
        gtfs: realtime
        endpoints:
          - type: WebSocket
            path: /ws/updates
            topic: route.<route_id>.stop_times
        data_entities:
          - routes.route_short_name
          - object: trips
            fields:
              - trips.trip_headsign
              - stop_times.departure_time
      - name: RouteAlerts
        description: Displays active alerts that apply to the route.
        type: feed
        gtfs: realtime
        endpoints:
          - type: WebSocket
            path: /ws/updates
            topic: route.<route_id>.alerts
      - name: RouteSchedule
        description: Displays scheduled and estimated departures by stop.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>
            key: components.route_schedule
        data_entities:
          - object: calendar
            fields:
              - service_id
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
              - start_date
              - end_date
          - object: calendar_dates
            fields:
              - service_id
              - date
              - exception_type
          - object: services
            fields:
              - calendar.service_id
              - array: directions
                fields:
                  - trips.direction_id
                  - route.first_trip_departure_time
                  - route.last_trip_departure_time
                  - array: trips
                    fields:
                      - trips.trip_id
                      - route.first_stop_name
                      - route.first_departure_time
                      - route.last_stop_name
                      - route.last_arrival_time
                      - array: stop_times
                        fields:
                          - stops.stop_name
                          - stop_times.departure_time
      - name: RouteMap
        description: Shows trip shapes and, when available, real-time vehicle positions.
        type: feed
        gtfs: schedule
        endpoints:
          - type: GeoJSON
            path: /web/routes/<route_id>/map
      - name: RouteStops
        description: Lists the route's stops in both directions.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>
        data_entities:
          - array: directions
            fields:
              - direction_id
              - array: stops
                fields:
                  - stop_id
                  - stop_code
                  - stop_name
                  - tts_stop_name
                  - stop_desc
                  - stop_lat
                  - stop_lon
                  - zone_id
                  - stop_url
                  - location_type
                  - parent_station
                  - stop_timezone
                  - wheelchair_boarding
                  - level_id
                  - platform_code
                  - stop_access
      - name: RouteFares
        description: Displays fares and fare rules applicable to the route.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/routes/<route_id>/fares

  - name: Regions
    path: /routes/regions
    description: Bundled routes within a specific region.
    components:
      - name: RegionsSearch
        description: Finds regions by name, identifier, or other criteria.
      - name: RegionsMap
        description: Shows all regions within the service area.

  - name: Region
    path: /routes/regions/<region_id>
    description: Detail page for a single region.
    components:
      - name: RegionHeader
        description: Presents the region's ID, name, and essential information.
      - name: RegionMap
        description: Shows the region's boundaries and included routes.

  - name: Stops
    path: /stops
    description: Information about all stops in the transit system.
    components:
      - name: StopsSearch
        description: Finds stops by name, identifier, location, or other criteria.
      - name: StopsMap
        description: Shows all stops within the service area.

  - name: Stop
    path: /stops/<stop_id>
    description: Detail page for a single transit stop.
    components:
      - name: StopHeader
        description: Presents the stop's ID, name, and essential information.
      - name: StopNextArrivals
        description: Shows upcoming arrivals at the stop.
      - name: StopAlerts
        description: Displays active alerts that apply to the stop.
      - name: StopRoutes
        description: Lists routes that serve the stop.
      - name: StopMap
        description: Shows the stop location and nearby area.

  - name: Trips
    path: /trips
    description: Current and recent trips in the network, and departures by stop, route, destination and time.
    components:
      - name: TripsFinder
        description: Searches stops by name, sign code or nearby location, routes by number or name, and destinations by place, and remembers recent and saved choices on the device.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/trips/search
            key: components.trips_finder
        data_entities:
          - object: stops
            fields:
              - stops.stop_id
              - stops.stop_code
              - stops.stop_name
              - stops.stop_desc
              - stops.platform_code
              - stops.location_type
              - stops.parent_station
              - stops.wheelchair_boarding
              - stops.stop_lat
              - stops.stop_lon
          - object: routes
            fields:
              - routes.route_id
              - routes.route_short_name
              - routes.route_long_name
              - routes.route_color
              - routes.route_text_color
              - agency.agency_name
          - object: destinations
            fields:
              - trips.trip_headsign
              - routes.route_id
              - routes.route_short_name
      - name: TripsDisruptions
        description: Flags alerts on the chosen stop and routes above the results, or the most severe network alerts when nothing is chosen, each linking to its alert page.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips
            key: components.trips_disruptions
        data_entities:
          - feed_header.timestamp
          - object: alerts
            fields:
              - feed_entity.id
              - alerts.header_text
              - alerts.effect
              - alerts.severity_level
              - alert.status
              - alerts.informed_entity.agency_id
              - alerts.informed_entity.route_id
              - alerts.informed_entity.route_type
              - alerts.informed_entity.stop_id
      - name: TripsDepartures
        description: Once a stop, route or destination is chosen, lists departures for that time, marks each as live or scheduled, flags cancelled, accessible and crowded buses and the last bus, and says when there is no more service.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips
            key: components.trips_departures
        data_entities:
          - stops.stop_id
          - stops.stop_code
          - stops.stop_name
          - stops.platform_code
          - stops.wheelchair_boarding
          - trip_updates.timestamp
          - object: service_exceptions
            fields:
              - calendar_dates.service_id
              - calendar_dates.date
              - calendar_dates.exception_type
          - object: routes
            fields:
              - routes.route_id
              - routes.route_short_name
              - routes.route_long_name
              - routes.route_color
              - routes.route_text_color
              - agency.agency_name
              - stop.first_departure_time
              - stop.last_departure_time
              - stop.next_service_date
              - object: departures
                fields:
                  - run.id
                  - run.start_date
                  - run.last_seen_at
                  - trips.trip_id
                  - trips.service_id
                  - trips.trip_headsign
                  - trips.trip_short_name
                  - trips.direction_id
                  - trips.wheelchair_accessible
                  - trips.bikes_allowed
                  - stop_times.stop_sequence
                  - stop_times.stop_headsign
                  - stop_times.departure_time
                  - stop_times.pickup_type
                  - frequencies.start_time
                  - frequencies.end_time
                  - frequencies.headway_secs
                  - frequencies.exact_times
                  - trip.is_last_of_day
                  - trip_updates.trip.start_time
                  - trip_updates.trip.schedule_relationship
                  - trip_updates.stop_time_update.stop_sequence
                  - trip_updates.stop_time_update.stop_id
                  - trip_updates.stop_time_update.departure.time
                  - trip_updates.stop_time_update.departure.delay
                  - trip_updates.stop_time_update.departure.uncertainty
                  - trip_updates.stop_time_update.schedule_relationship
                  - trip_updates.stop_time_update.departure_occupancy_status
                  - vehicle_positions.occupancy_status
                  - vehicle_positions.vehicle.wheelchair_accessible
      - name: TripsInService
        description: Shows the trips running now and those that ended in the last hours, by operator and route, each marked as on time, late, without signal, not tracked, cancelled, interrupted or completed, and says how many routes are tracked.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips
            key: components.trips_in_service
        data_entities:
          - trip_updates.timestamp
          - vehicle_positions.timestamp
          - object: agencies
            fields:
              - agency.agency_id
              - agency.agency_name
              - object: routes
                fields:
                  - routes.route_id
                  - routes.route_short_name
                  - routes.route_long_name
                  - routes.route_color
                  - routes.route_text_color
                  - object: runs
                    fields:
                      - run.id
                      - run.start_date
                      - run.start_time
                      - run.run_lifecycle_state
                      - run.completion_reason
                      - run.last_seen_at
                      - trips.trip_id
                      - trips.trip_headsign
                      - trips.direction_id
                      - trip.last_stop_name
                      - trip.last_arrival_time
                      - trip_updates.trip.schedule_relationship
                      - trip_updates.delay
                      - vehicle_positions.occupancy_status
                  - object: scheduled_not_tracked
                    fields:
                      - trips.trip_id
                      - trips.trip_headsign
                      - trips.direction_id
                      - stop_times.departure_time
                      - frequencies.headway_secs
      - name: TripsMap
        description: Loads on request a map of the chosen stop, the paths of its routes and the buses on their way, or of every tracked bus in service when nothing is chosen.
        type: feed
        gtfs: realtime
        endpoints:
          - type: GeoJSON
            path: /web/trips/map
        data_entities:
          - stops.stop_lat
          - stops.stop_lon
          - trips.shape_id
          - object: shapes
            fields:
              - shapes.shape_id
              - shapes.shape_pt_lat
              - shapes.shape_pt_lon
              - shapes.shape_pt_sequence
          - object: vehicles
            fields:
              - run.id
              - vehicle_positions.position.latitude
              - vehicle_positions.position.longitude
              - vehicle_positions.position.bearing
              - vehicle_positions.vehicle.label
              - vehicle_positions.timestamp

  - name: Trip
    path: /trips/<run_id>
    description: One bus journey, covering where it is, when it reaches the passenger's stops, what to do if something changes, and how it went once it has ended.
    components:
      - name: TripHeader
        description: Presents the route, destination, operator and its contact, and a share link that keeps the passenger's stops.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/trips/<run_id>
            key: components.trip_header
        data_entities:
          - run.id
          - run.start_date
          - run.start_time
          - trips.trip_id
          - trips.trip_headsign
          - trips.trip_short_name
          - trips.direction_id
          - routes.route_id
          - routes.route_short_name
          - routes.route_long_name
          - routes.route_color
          - routes.route_text_color
          - agency.agency_name
          - agency.agency_phone
          - agency.agency_url
          - trip.first_stop_name
          - trip.last_stop_name
          - trip.last_arrival_time
      - name: TripStatus
        description: Says in one line whether the bus is on time, late, cancelled, without signal, not tracked or finished, and how fresh that is.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips/<run_id>
            key: components.trip_status
          - type: WebSocket
            path: /ws/updates
            topic: trip.lifecycle.by_run.<run_id>
        data_entities:
          - run.run_lifecycle_state
          - run.schedule_relationship
          - run.completion_reason
          - run.last_seen_at
          - trip_updates.trip.schedule_relationship
          - trip_updates.delay
          - trip_updates.timestamp
          - vehicle_positions.timestamp
      - name: TripVehicle
        description: Helps the passenger recognise and board the right bus by its number, plate, wheelchair access, bike policy and crowding, or says the bus is not identified.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips/<run_id>
            key: components.trip_vehicle
          - type: WebSocket
            path: /ws/updates
            topic: trip.occupancy_status.by_run.<run_id>
        data_entities:
          - vehicle_positions.vehicle.label
          - vehicle_positions.vehicle.license_plate
          - vehicle_positions.vehicle.wheelchair_accessible
          - vehicle_positions.occupancy_status
          - vehicle_positions.occupancy_percentage
          - vehicle_positions.timestamp
          - trips.wheelchair_accessible
          - trips.bikes_allowed
      - name: TripStops
        description: Lists every stop with scheduled and estimated times, shows where the bus is, counts down to the passenger's boarding and alighting stops, flags skipped, replaced, platform-changed and drop-off-only stops, and after the trip shows the last estimate recorded at each stop.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips/<run_id>
            key: components.trip_stops
          - type: WebSocket
            path: /ws/updates
            topic: trip.stop_time_updates.by_run.<run_id>
          - type: WebSocket
            path: /ws/updates
            topic: trip.vehicle_stop_status.by_run.<run_id>
        data_entities:
          - vehicle_positions.current_stop_sequence
          - vehicle_positions.current_status
          - vehicle_positions.stop_id
          - trip_updates.timestamp
          - trip_updates.delay
          - trip_updates.trip.modified_trip.modifications_id
          - object: stop_times
            fields:
              - stop_times.stop_sequence
              - stops.stop_id
              - stops.stop_code
              - stops.stop_name
              - stops.tts_stop_name
              - stops.platform_code
              - stops.wheelchair_boarding
              - stops.stop_lat
              - stops.stop_lon
              - stop_times.stop_headsign
              - stop_times.arrival_time
              - stop_times.departure_time
              - stop_times.pickup_type
              - stop_times.drop_off_type
              - stop_times.timepoint
              - trip_updates.stop_time_update.stop_sequence
              - trip_updates.stop_time_update.stop_id
              - trip_updates.stop_time_update.arrival.time
              - trip_updates.stop_time_update.arrival.delay
              - trip_updates.stop_time_update.arrival.uncertainty
              - trip_updates.stop_time_update.schedule_relationship
              - trip_updates.stop_time_update.stop_time_properties.assigned_stop_id
              - trip_updates.stop_time_update.stop_time_properties.stop_headsign
              - trip_updates.stop_time_update.stop_time_properties.pickup_type
              - trip_updates.stop_time_update.stop_time_properties.drop_off_type
          - object: replacement_stops
            fields:
              - trip_modifications.modifications.replacement_stops.stop_id
              - trip_modifications.modifications.replacement_stops.travel_time_to_stop
              - stops.stop_name
      - name: TripAlerts
        description: Shows the alerts that affect this journey in plain words, marking those that touch the passenger's stops.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips/<run_id>
            key: components.trip_alerts
          - type: WebSocket
            path: /ws/updates
            topic: trip.alerts.by_run.<run_id>
        data_entities:
          - object: alerts
            fields:
              - feed_entity.id
              - alerts.header_text
              - alerts.effect
              - alerts.severity_level
              - alert.status
              - alerts.impact_period.start
              - alerts.impact_period.end
              - alerts.informed_entity.agency_id
              - alerts.informed_entity.route_id
              - alerts.informed_entity.direction_id
              - alerts.informed_entity.stop_id
              - alerts.informed_entity.trip.trip_id
              - alerts.informed_entity.trip.start_date
      - name: TripAlternatives
        description: Shows the previous and next departures on the same route and direction from the passenger's stop, for when this bus is cancelled, full or missed.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/trips/<run_id>
            key: components.trip_alternatives
        data_entities:
          - object: departures
            fields:
              - run.id
              - trips.trip_id
              - trips.route_id
              - trips.direction_id
              - trips.trip_headsign
              - trips.wheelchair_accessible
              - routes.route_short_name
              - routes.route_color
              - stop_times.departure_time
              - stop_times.pickup_type
              - trip_updates.trip.schedule_relationship
              - trip_updates.stop_time_update.departure.time
              - trip_updates.stop_time_update.departure_occupancy_status
              - vehicle_positions.occupancy_status
      - name: TripMap
        description: Loads on request a map of the trip path, its stops, the bus position and any detour.
        type: feed
        gtfs: realtime
        endpoints:
          - type: GeoJSON
            path: /web/trips/<run_id>/map
          - type: WebSocket
            path: /ws/updates
            topic: trip.vehicle_positions.by_run.<run_id>
        data_entities:
          - trips.shape_id
          - object: shapes
            fields:
              - shapes.shape_pt_lat
              - shapes.shape_pt_lon
              - shapes.shape_pt_sequence
          - stop_times.shape_dist_traveled
          - object: stops
            fields:
              - stops.stop_id
              - stops.stop_name
              - stops.stop_lat
              - stops.stop_lon
          - trip_updates.trip.modified_trip.modifications_id
          - trip_modifications.selected_trips.trip_ids
          - trip_modifications.selected_trips.shape_id
          - feed_entity.shape.shape_id
          - feed_entity.shape.encoded_polyline
          - vehicle_positions.position.latitude
          - vehicle_positions.position.longitude
          - vehicle_positions.position.bearing
          - vehicle_positions.timestamp

  - name: Fares
    path: /fares
    description: Information about all fare products and payment options.
    components:
      - name: FaresSearch
        description: Finds fare products by name, audience, zone, or price.
      - name: FaresProductMenu
        description: Lists available fare products and their primary characteristics.

  - name: Fare Product
    path: /fares/<fare_product_id>
    description: Detail page for a single fare product.
    components:
      - name: FareProductHeader
        description: Presents the fare product's name, price, and key eligibility information.
      - name: FareProductDescription
        description: Explains validity, purchase, use, and fare rules.

  - name: Alerts
    path: /alerts
    description: All current, upcoming and recent service alerts, with the passenger's own routes and stops first.
    components:
      - name: AlertsForYou
        description: Shows alerts for the routes and stops the passenger follows on this device, plus network-wide ones, or says plainly that there are none and when the feed was checked; with nothing followed, explains how to follow.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts
            key: components.alerts_for_you
        data_entities:
          - feed_header.timestamp
          - object: alerts
            fields:
              - feed_entity.id
              - alerts.header_text
              - alerts.effect
              - alerts.severity_level
              - alert.status
              - alerts.impact_period.start
              - alerts.impact_period.end
              - alerts.informed_entity.agency_id
              - alerts.informed_entity.route_id
              - alerts.informed_entity.route_type
              - alerts.informed_entity.stop_id
      - name: AlertsSearch
        description: Finds a route, stop or operator to check or follow, and filters every alert list by effect, cause and dates.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/alerts/search
            key: components.alerts_search
        data_entities:
          - object: routes
            fields:
              - routes.route_id
              - routes.route_short_name
              - routes.route_long_name
          - object: stops
            fields:
              - stops.stop_id
              - stops.stop_code
              - stops.stop_name
          - object: agencies
            fields:
              - agency.agency_id
              - agency.agency_name
      - name: AlertsList
        description: Lists every alert, in effect now and then upcoming, most severe first, filterable by operator and by effect such as detours or accessibility issues, or says there are none.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts
            key: components.alerts_list
        data_entities:
          - feed_header.timestamp
          - object: alerts
            fields:
              - feed_entity.id
              - alerts.header_text
              - alerts.tts_header_text
              - alerts.cause
              - alerts.effect
              - alerts.severity_level
              - alert.status
              - alerts.impact_period.start
              - alerts.impact_period.end
              - object: affected_routes
                fields:
                  - routes.route_short_name
                  - routes.route_color
                  - routes.route_text_color
              - object: affected_stops
                fields:
                  - stops.stop_name
      - name: AlertsRecent
        description: Lists alerts that have left the feed in the last days, with when they were first and last published, so anyone can check what happened.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts
            key: components.alerts_recent
        data_entities:
          - object: alerts
            fields:
              - feed_entity.id
              - alerts.header_text
              - alerts.cause
              - alerts.effect
              - alerts.severity_level
              - alerts.impact_period.start
              - alerts.impact_period.end
              - alert.first_seen_at
              - alert.last_seen_at
              - object: affected_routes
                fields:
                  - routes.route_short_name
                  - routes.route_color
                  - routes.route_text_color
      - name: AlertsServiceDays
        description: Lists the coming dates when service is added or removed, such as holidays, from the schedule's calendar exceptions, marking the routes the passenger follows.
        type: feed
        gtfs: schedule
        endpoints:
          - type: JSON
            path: /web/alerts
            key: components.alerts_service_days
        data_entities:
          - object: service_days
            fields:
              - calendar_dates.date
              - calendar_dates.service_id
              - calendar_dates.exception_type
              - object: routes
                fields:
                  - trips.service_id
                  - routes.route_id
                  - routes.route_short_name
                  - routes.route_color
                  - routes.route_text_color

  - name: Alert
    path: /alerts/<entity_id>
    description: One alert explained, covering who is affected, when, and what to do, including after it has ended.
    components:
      - name: AlertHeader
        description: Presents the alert in plain words with its effect, severity, cause, whether it is upcoming, in effect or over, when it was first and last published, and a share link that still works after the alert ends.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts/<entity_id>
            key: components.alert_header
        data_entities:
          - feed_entity.id
          - alerts.header_text
          - alerts.tts_header_text
          - alerts.severity_level
          - alerts.cause
          - alerts.effect
          - alert.status
          - alert.first_seen_at
          - alert.last_seen_at
          - feed_header.timestamp
      - name: AlertAffectedServices
        description: Lists what is affected, keeping route, direction, stop and trip together as the alert gives them, each linking to its page, with other routes that still serve each affected stop.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts/<entity_id>
            key: components.alert_affected_services
        data_entities:
          - object: informed_entities
            fields:
              - alerts.informed_entity.agency_id
              - alerts.informed_entity.route_id
              - alerts.informed_entity.route_type
              - alerts.informed_entity.direction_id
              - alerts.informed_entity.stop_id
              - alerts.informed_entity.trip.trip_id
              - alerts.informed_entity.trip.start_date
              - agency.agency_name
              - routes.route_short_name
              - routes.route_long_name
              - routes.route_color
              - routes.route_text_color
              - stops.stop_code
              - stops.stop_name
              - run.id
              - object: other_routes
                fields:
                  - routes.route_id
                  - routes.route_short_name
                  - routes.route_color
      - name: AlertPeriod
        description: Says in plain dates when service is affected and when the alert is shown, and says when no end date has been announced.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts/<entity_id>
            key: components.alert_period
        data_entities:
          - alert.status
          - object: impact_period
            fields:
              - alerts.impact_period.start
              - alerts.impact_period.end
          - object: communication_period
            fields:
              - alerts.communication_period.start
              - alerts.communication_period.end
      - name: AlertDescription
        description: Explains what is happening and what changes for the passenger, including temporary stops, in text that screen readers can speak.
        type: feed
        gtfs: realtime
        endpoints:
          - type: JSON
            path: /web/alerts/<entity_id>
            key: components.alert_description
        data_entities:
          - alerts.description_text
          - alerts.tts_description_text
          - alerts.cause
          - alerts.cause_detail
          - alerts.effect
          - alerts.effect_detail
          - alerts.url
          - alerts.image.localized_image.url
          - alerts.image_alternative_text
          - object: temporary_stops
            fields:
              - trip_modifications.modifications.service_alert_id
              - trip_modifications.modifications.replacement_stops.stop_id
              - trip_modifications.modifications.replacement_stops.travel_time_to_stop
              - stops.stop_name
              - feed_entity.stop.stop_name
      - name: AlertGuidance
        description: Renders staff-written advice, such as alternative routes, walking directions to temporary stops and photos.
        type: editorial_content
      - name: AlertMap
        description: Loads on request a map of the affected stops, the detour path and the temporary stops.
        type: feed
        gtfs: realtime
        endpoints:
          - type: GeoJSON
            path: /web/alerts/<entity_id>/map
        data_entities:
          - object: shapes
            fields:
              - shapes.shape_id
              - shapes.shape_pt_lat
              - shapes.shape_pt_lon
              - shapes.shape_pt_sequence
          - trip_modifications.modifications.service_alert_id
          - trip_modifications.selected_trips.shape_id
          - feed_entity.shape.shape_id
          - feed_entity.shape.encoded_polyline
          - object: stops
            fields:
              - stops.stop_id
              - stops.stop_lat
              - stops.stop_lon
          - object: temporary_stops
            fields:
              - feed_entity.stop.stop_id
              - feed_entity.stop.stop_lat
              - feed_entity.stop.stop_lon

  - name: News
    path: /news
    description: News and updates about the public transportation service.
    components:
